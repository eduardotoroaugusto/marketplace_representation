<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - Catálogo</title>
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Proteção da tela: sem token, volta para o login -->
  <script>
    if (!localStorage.getItem('authToken') || !localStorage.getItem('authEmail')) {
      window.location.href = 'index.html';
    }
  </script>
</head>
<body class="catalog-body">

  <!-- Barra de navegação superior -->
  <header class="top-nav">
    <div class="nav-left">
      <div class="logo-badge">
        <img src="assets/icons/cart-logo.svg" alt="" class="icon-16">
        <span>[LOGO]</span>
      </div>
      <nav class="nav-links">
        <a href="#" class="nav-link active">Home</a>
        <a href="compras.html" class="nav-link">Compras</a>
        <a href="jogos.html" class="nav-link">Jogos</a>
      </nav>
    </div>

    <div class="nav-search">
      <img src="assets/icons/search.svg" alt="" class="icon-16">
      <input type="text" id="search-input" placeholder="Buscar produtos, marcas...">
    </div>

    <div class="nav-right">
      <button class="nav-icon-btn" id="btn-notif" aria-label="Notificações">
        <img src="assets/icons/bell.svg" alt="" class="icon-32">
      </button>

      <button class="nav-icon-btn cart-trigger" id="btn-cart" aria-label="Carrinho">
        <img src="assets/icons/bag.svg" alt="" class="icon-20">
        <span class="cart-badge" id="cart-count">0</span>
      </button>

      <div class="user-menu" id="user-menu">
        <div class="user-avatar" id="user-initials">JD</div>
        <span class="user-name" id="user-name">Usuário</span>
        <img src="assets/icons/chevron-down.svg" alt="" class="icon-12">
        <div class="user-dropdown hidden" id="user-dropdown">
          <a href="perfil.html" class="dropdown-item dropdown-link">Meu perfil</a>
          <button class="dropdown-item" id="btn-logout">Sair</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Barra superior (só no layout mobile) -->
  <header class="m-topbar only-mobile">
    <p class="m-greeting">Olá, <span id="greeting-name">Usuário</span></p>
    <div class="m-actions">
      <a href="notificacoes.html" class="m-icon-btn" aria-label="Notificações">
        <span class="mask-icon icon-20" style="-webkit-mask-image: url(assets/icons/m-bell.svg); mask-image: url(assets/icons/m-bell.svg)"></span>
        <span class="m-badge alert hidden" data-notif-count>0</span>
      </a>
      <a href="compras.html" class="m-icon-btn" aria-label="Carrinho">
        <span class="mask-icon icon-20" style="-webkit-mask-image: url(assets/icons/m-cart.svg); mask-image: url(assets/icons/m-cart.svg)"></span>
        <span class="m-badge" data-cart-count>0</span>
      </a>
    </div>
  </header>

  <!-- Corpo -->
  <main class="home-body">
    <!-- Busca e categorias do layout mobile -->
    <div class="m-search only-mobile">
      <img src="assets/icons/search.svg" alt="" class="icon-16">
      <input type="text" id="search-input-mobile" placeholder="Buscar produtos, marcas..." aria-label="Buscar produtos">
    </div>
    <div class="category-chips only-mobile" id="category-chips">
      <button type="button" class="chip active" data-category="Todos">Todos</button>
      <button type="button" class="chip" data-category="Eletrônicos">Eletrônicos</button>
      <button type="button" class="chip" data-category="Roupas">Roupas</button>
      <button type="button" class="chip" data-category="Casa">Casa</button>
      <button type="button" class="chip" data-category="Esportes">Esportes</button>
      <button type="button" class="chip" data-category="Livros">Livros</button>
    </div>

    <!-- Filtros -->
    <aside class="sidebar-filters">
      <h2 class="sidebar-title">Categorias</h2>
      <ul class="category-list" id="category-list">
        <li class="category-item active" data-category="Todos">
          <span class="checkbox"><img src="assets/icons/check.svg" alt="" class="check-icon"></span>
          <span>Todos</span>
        </li>
        <li class="category-item" data-category="Eletrônicos">
          <span class="checkbox"><img src="assets/icons/check.svg" alt="" class="check-icon"></span>
          <span>Eletrônicos</span>
        </li>
        <li class="category-item" data-category="Roupas">
          <span class="checkbox"><img src="assets/icons/check.svg" alt="" class="check-icon"></span>
          <span>Roupas</span>
        </li>
        <li class="category-item" data-category="Casa">
          <span class="checkbox"><img src="assets/icons/check.svg" alt="" class="check-icon"></span>
          <span>Casa</span>
        </li>
        <li class="category-item" data-category="Esportes">
          <span class="checkbox"><img src="assets/icons/check.svg" alt="" class="check-icon"></span>
          <span>Esportes</span>
        </li>
        <li class="category-item" data-category="Livros">
          <span class="checkbox"><img src="assets/icons/check.svg" alt="" class="check-icon"></span>
          <span>Livros</span>
        </li>
      </ul>
    </aside>

    <!-- Grid de produtos -->
    <section class="grid-area">
      <div class="results-bar">
        <p class="results-title" id="results-title">Resultados de busca para "Todos"</p>
        <div class="sort-control">
          <span class="sort-label">Ordenar por:</span>
          <select id="sort-select" class="sort-select">
            <option value="relevance">Mais relevantes</option>
            <option value="price-asc">Menor preço</option>
            <option value="price-desc">Maior preço</option>
          </select>
        </div>
      </div>

      <div id="catalog-grid" class="catalog-grid">
        <!-- Cards injetados pela CatalogView -->
      </div>

      <div class="load-more-wrap">
        <button class="btn-load-more" id="btn-load-more">Carregar mais produtos</button>
      </div>
    </section>
  </main>

  <!-- Navegação inferior (só no layout mobile) -->
  <nav class="bottom-nav" aria-label="Navegação principal">
    <a href="catalogo.html" class="bottom-tab active" aria-current="page">
      <span class="mask-icon icon-20" style="-webkit-mask-image: url(assets/icons/nav-home.svg); mask-image: url(assets/icons/nav-home.svg)"></span>
      <span>Home</span>
    </a>
    <a href="compras.html" class="bottom-tab">
      <span class="mask-icon icon-20" style="-webkit-mask-image: url(assets/icons/nav-bag.svg); mask-image: url(assets/icons/nav-bag.svg)"></span>
      <span>Compras</span>
    </a>
    <a href="jogos.html" class="bottom-tab">
      <span class="mask-icon icon-20" style="-webkit-mask-image: url(assets/icons/nav-gamepad.svg); mask-image: url(assets/icons/nav-gamepad.svg)"></span>
      <span>Jogos</span>
    </a>
    <a href="notificacoes.html" class="bottom-tab">
      <span class="mask-icon icon-20" style="-webkit-mask-image: url(assets/icons/nav-bell.svg); mask-image: url(assets/icons/nav-bell.svg)"></span>
      <span>Notificações</span>
    </a>
    <a href="perfil.html" class="bottom-tab">
      <span class="mask-icon icon-20" style="-webkit-mask-image: url(assets/icons/nav-user.svg); mask-image: url(assets/icons/nav-user.svg)"></span>
      <span>Perfil</span>
    </a>
  </nav>

  <!-- Scripts (core -> models -> services -> viewmodels -> views -> events -> main) -->
  <script src="js/core/observable.js"></script>

  <script src="js/models/product.js"></script>
  <script src="js/models/cartItem.js"></script>

  <script src="js/services/api.js"></script>

  <script src="js/viewmodels/authViewModel.js"></script>
  <script src="js/viewmodels/catalogViewModel.js"></script>
  <script src="js/viewmodels/cartViewModel.js"></script>

  <script src="js/views/catalogView.js"></script>
  <script src="js/views/cartView.js"></script>

  <script src="js/events/domEvents.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
